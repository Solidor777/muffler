name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Inject release metadata into module.json
        run: node tools/build-manifest.mjs
      - name: Package module.zip
        run: zip -r module.zip module.json dist lang README.md LICENSE bot -x 'bot/node_modules/*'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            module.json
            module.zip
